name: Compiler Repo Indexes

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
      - 'Packages'
      - 'Packages.gz'
      - 'Packages.bz2'
      - 'CNAME'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

concurrency:
  group: compiler
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Dynamically Scan and Generate Indexes
      run: |
        echo "[*] Installing dpkg-dev and compression tools..."
        sudo apt-get update && sudo apt-get install -y dpkg-dev bzip2 gzip
        
        echo "[*] Scanning debs folder..."
        mkdir -p debs
        dpkg-scanpackages -m debs > Packages
        
        echo "[*] Compressing indexes..."
        rm -f Packages.gz Packages.bz2
        gzip -9fk Packages
        bzip2 -9fk Packages

    - name: Configuration du Domaine Personnalisé (CNAME)
      run: |
        echo "[*] Generating CNAME..."
        echo "cydiauseful.github.io" > CNAME

    - name: Upload and Push Generated Files to Main Branch
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        git add -f Packages Packages.gz Packages.bz2 CNAME
        if [ -f "Release" ]; then git add -f Release; fi
        if [ -f "index.html" ]; then git add -f index.html; fi
        
        git commit -m "Autogen: Refresh repo indexes (.bz2, .gz) & CNAME" || echo "No changes to commit"
        git push origin main
