name: Compiler and Deploy Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # PREMIER JOB : COMPILATION ET MISE À JOUR DU DÉPÔT GIT
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Dynamically Scan and Generate Indexes
      run: |
        echo "[*] Installing dpkg-dev and compression tools..."
        sudo apt-get update && sudo apt-get install -y dpkg-dev bzip2 gzip
        
        echo "[*] Scanning debs folder..."
        mkdir -p debs
        dpkg-scanpackages -m debs > Packages
        
        echo "[*] Compressing indexes..."
        rm -f Packages.gz Packages.bz2
        gzip -9fk Packages
        bzip2 -9fk Packages

    - name: Configuration du Domaine Personnalisé (CNAME)
      run: |
        echo "[*] Generating CNAME for GitHub Pages..."
        echo "repo.cydiauseful.com" > CNAME

    - name: Upload and Push Generated Files to Main Branch
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        git add -f Packages Packages.gz Packages.bz2 CNAME
        if [ -f "Release" ]; then git add -f Release; fi
        if [ -f "index.html" ]; then git add -f index.html; fi
        
        git commit -m "Autogen: Refresh repo indexes (.bz2, .gz) & CNAME [skip ci]" || echo "No changes to commit"
        git push origin main

  # DEUXIÈME JOB : DEPLOIEMENT PROPRE SUR GITHUB PAGES
  deploy:
    runs-on: ubuntu-latest
    needs: build # Ce job attend impérativement que le push du premier job soit terminé !
    steps:
    - name: Checkout Updated Branch
      uses: actions/checkout@v4
      with:
        ref: main # Récupère les fichiers fraîchement mis à jour par le bot

    - name: Setup Pages (With Auto-Enablement Force)
      uses: actions/configure-pages@v5
      with:
        enablement: true

    - name: Upload Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4

    - name: Finalize Status Notification
      run: |
        echo "========================================="
        echo " [V] Environment deployed successfully! "
        echo " URL: https://repo.cydiauseful.com       "
        echo "========================================="
